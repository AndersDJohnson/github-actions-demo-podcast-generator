name: "Podcast Generator (Anders version)"
author: "Anders Johnson"
description: "Generates a feed for a podcast from a YAML file. Based on https://github.com/planetoftheweb/podcast-generator"
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email:
    description: The commiter's email address
    required: true
    default: ${{ github.actor }}@localhost
  name:
    description: The committer's name
    required: true
    default: ${{ github.actor }}
